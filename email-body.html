<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; -webkit-font-smoothing: antialiased; }
  .wrapper { max-width: 600px; margin: 0 auto; }
  .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #ffffff; padding: 36px 28px 32px; text-align: center; border-radius: 12px 12px 0 0; }
  .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
  .header .date { font-size: 16px; opacity: 0.88; letter-spacing: 1px; }
  .body-area { background: #ffffff; padding: 28px 24px; border-radius: 0 0 12px 12px; }
  .card { background: #fafaff; border-radius: 10px; padding: 22px 20px; margin-bottom: 16px; border-left: 4px solid #667eea; }
  .card .tag { display: inline-block; background: #667eea; color: #fff; padding: 3px 12px; border-radius: 14px; font-size: 14px; margin-bottom: 10px; }
  .card h2 { font-size: 18px; font-weight: 600; color: #1d1d1f; margin-bottom: 8px; }
  .card p { font-size: 17px; line-height: 1.8; color: #444; }
  .footer { text-align: center; padding: 20px; color: #aaa; font-size: 14px; }
  .note { background: #fffbe6; border-radius: 8px; padding: 16px 20px; margin-top: 16px; font-size: 16px; color: #8a6d3b; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>每日对话总结</h1>
    <div class="date">2026 / 08 / 11 · 星期二</div>
  </div>
  <div class="body-area">
    <div class="card">
      <span class="tag">无对话</span>
      <h2>安静的星期二</h2>
      <p>昨天没有 WorkBuddy 对话记录。这通常意味着当天没有使用 WorkBuddy，或没有发起新的任务。</p>
    </div>

    <div class="card">
      <h2>备注</h2>
      <p>今日（8/12）的自动化投递通道已完成配置：邮件发送到 seanwu988@gmail.com、企业微信投递到 WuJiang 群、本地 HTML 可通过桌面「每日对话总结」快捷方式查看、网页版发布在 GitHub Pages。</p>
      <p style="margin-top: 10px;">明天起恢复正常的每日总结生成。</p>
    </div>
  </div>
  <div class="footer">
    由 WorkBuddy 自动生成 · 每日 8:00
  </div>
</div>
</body>
</html>
